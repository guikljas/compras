<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CompraControl | Erimax</title><link rel="stylesheet" href="styles.css"><style>.brand-logo{width:132px;height:auto;display:block}.brand{gap:14px}.brand small{white-space:nowrap}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.import-panel{display:flex;justify-content:space-between;gap:24px;align-items:center;margin:0 0 16px;padding:24px;border:1px dashed #85add0;border-radius:10px;background:linear-gradient(120deg,#eef7ff,#fff)}.import-panel h3{margin:0 0 7px;font:800 18px Outfit}.import-panel p{max-width:680px;margin:0 0 8px;color:#526a7d;font-size:12px;line-height:1.6}.import-panel small{color:#71818d;font-size:10px}.import-panel>div:last-child{display:grid;gap:11px;min-width:175px;text-align:center}@media(max-width:700px){.import-panel{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}</style></head>
